name: Build mod
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Download Forge MDK and add mod sources from mod.zip
        run: |
          curl -fL -o mdk.zip https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.3.0/forge-1.20.1-47.3.0-mdk.zip
          mkdir mdk
          unzip -q mdk.zip -d mdk
          rm -rf mdk/src
          mkdir modsrc
          unzip -q mod.zip -d modsrc
          cp -r modsrc/src mdk/src
          cp modsrc/gradle.properties mdk/gradle.properties
          echo "Java files:" && find mdk/src -name "*.java"
      - name: Build
        working-directory: mdk
        run: |
          chmod +x gradlew
          ./gradlew build
      - uses: actions/upload-artifact@v4
        with:
          name: wanderer-mod
          path: mdk/build/libs/*.jar
